<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>JavaScript</title>

    <script type="text/javascript">

    function minhafuncao1(arg1){
        
        var raiz = Math.sqrt (arg1) ;
        
        alert('A raiz quadrada é '+raiz)
    }


    function minhafuncao2(arg2){
        
        var raiz = Math.sqrt (arg2) ;
        
        alert('A raiz quadrada é '+raiz)
    }


    function minhafuncao3(arg3 ){
        
        var raiz = Math.sqrt (arg3) ;

        alert('A raiz quadrada é '+raiz)
    }

    
    function escreveDiv(texto ){
        document.getElementById("minhaDiv").innerHTML = texto;
    }

    function escreveDiv2(){
        texto = prompt('Digite um texto qualquer');
        document.getElementById("minhaDiv2").innerHTML = texto;
    }
    
    function escreveNumerosInput() {
        var input = document.getElementById("numeroInput");
        var n = parseInt(input.value);
        if (isNaN(n) ||  n  <= 0) {
            alert("Por favor, insira um número válido maior que zero.");
            return;
        }
        var div = document.getElementById("numeroInput");
        div.innerHTML = "";
        for (var i = 1; i <=n; i++) {
            div.innerHTML += i + "<br>";
        }
    }


    function escreveNumerosInput2() {
        var input = document.getElementById("numeroInput");
        var n = parseInt(input.value);
        if (isNaN(n) ||  n  <= 0) {
            alert("Por favor, insira um número válido maior que zero.");
            return;
        }
        var div = document.getElementById("numeroInput");
        div.innerHTML = "";
        for (var i = 1; i <=n; i++) {
            div.innerHTML += i + "<br>";
        }
    }

    </script>

</head>

<body>
    
  <h1>JavaScript</h1>

  <button onclick="minhafuncao1(25)">Raiz de 25</button>

  <br><br>

  <button onclick="minhafuncao2(36)">Raiz de 36</button>

 <br><br>
