<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Livros</title>

  <script>
    let pilhaLivros = [];

    function mostrarLista() {
      const container = document.getElementById('minhaDiv');
      container.innerHTML = '';

      for (let i = 0; i < pilhaLivros.length; i++) {
        const livro = pilhaLivros[i];

        const tag =
          '<h5>' +
          i + ' - Título: ' + livro.titulo +
          ' | Autor: ' + livro.autor +
          ' | Ano: ' + livro.ano +
          '</h5>';

        container.innerHTML += tag;
      }
    }

    function limpaCampos() {
      document.getElementById('titulo').value = '';
      document.getElementById('autor').value = '';
      document.getElementById('ano').value = '';
    }

    function adicionar() {
      const titulo = document.getElementById('titulo').value;
      const autor = document.getElementById('autor').value;
      const ano = document.getElementById('ano').value;

      pilhaLivros.push({
        titulo: titulo,
        autor: autor,
        ano: ano
      });

      limpaCampos();
      mostrarLista();
    }

    function posicao() {
      const indice = Number(
        prompt('Qual posição da lista deseja consultar?')
      );

      if (
        indice < 0 ||
        indice >= pilhaLivros.length ||
        !Number.isInteger(indice)
      ) {
        alert('Posição inválida!');
        return;
      }

      const livro = pilhaLivros[indice];

      alert(
        'Na posição ' + indice +
        ' está:\nTítulo: ' + livro.titulo +
        '\nAutor: ' + livro.autor +
        '\nAno: ' + livro.ano
      );
    }

    function limparLista() {
      pilhaLivros = [];
      mostrarLista();
    }

    function remover() {
      if (pilhaLivros.length === 0) {
        alert('A pilha está vazia!');
      } else {
        const removido = pilhaLivros.pop();

        alert(
          'Removido:\nTítulo: ' + removido.titulo +
          '\nAutor: ' + removido.autor +
          '\nAno: ' + removido.ano
        );

        mostrarLista();
      }
    }

    function inverterPilha() {
      pilhaLivros.reverse();
      mostrarLista();
    }
  </script>
</head>

<body>

  <h1>Lista de Livros</h1>

  <label>Título:</label>
  <input
    type="text"
    id="titulo"
    placeholder="Digite o título do livro"
  >

  <label>Autor:</label>
  <input
    type="text"
    id="autor"
    placeholder="Digite o nome do autor"
  >

  <label>Ano:</label>
  <input
    type="number"
    id="ano"
    placeholder="Digite o ano de publicação"
  >

  <button onclick="adicionar()">Adicionar</button>

  <br><br>

  <button onclick="posicao()">Posição</button>
  <button onclick="remover()">Remover Último</button>
  <button onclick="limparLista()">Limpar Lista</button>
  <button onclick="inverterPilha()">Inverter</button>

  <br><br>

  <div id="minhaDiv"></div>

</body>
</html>
